name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish to Pages. Nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Reads .nvmrc, so CI and local stay on the same Node by construction.
          node-version-file: .nvmrc
          cache: yarn

      - uses: actions/configure-pages@v6

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
